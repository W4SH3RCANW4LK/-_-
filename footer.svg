<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">

<defs>

<linearGradient id="xp" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#5ba5ff"></stop>
<stop offset="100%" stop-color="#245edb"></stop>
</linearGradient>

<linearGradient id="rainbow" x1="0%" x2="100%">
<stop offset="0%" stop-color="#ff3dbf"></stop>
<stop offset="25%" stop-color="#b14dff"></stop>
<stop offset="50%" stop-color="#00d9ff"></stop>
<stop offset="75%" stop-color="#ffe347"></stop>
<stop offset="100%" stop-color="#ff3dbf"></stop>

<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"></animateTransform>

</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"></feDropShadow>
</filter>

</defs>

<!-- Window -->

<rect x="190" y="30" width="660" height="220" rx="10" fill="#202330" stroke="#d9d9d9" stroke-width="2" filter="url(#shadow)"></rect>

<!-- Title -->

<rect x="190" y="30" width="660" height="32" rx="10" fill="url(#xp)"></rect>

<text x="225" y="51" font-family="Segoe UI" font-size="15" fill="white">

💻 logout.exe

</text>

<text x="790" y="50" fill="white">─ □ ✕</text>

<!-- Tape -->

<rect x="180" y="18" width="45" height="12" fill="#fff3aa" transform="rotate(-15 180 18)" opacity=".85"></rect>

<rect x="815" y="18" width="45" height="12" fill="#fff3aa" transform="rotate(15 815 18)" opacity=".85"></rect>

<!-- Terminal -->

<text x="220" y="90" fill="#d7d7d7" font-family="Consolas" font-size="18">
C:\Users\Guest&gt; exit
</text>

<text x="220" y="125" fill="#8ef5ff" font-family="Consolas" font-size="16">
[ STATUS ] disconnected...
</text>

<text x="220" y="170" fill="white" font-size="28">
connection terminated.
</text>

<text x="220" y="205" font-size="20" fill="url(#rainbow)">
see you next login.
</text>

<text x="220" y="235" fill="white" font-size="18">
(&gt; ^_^ )&gt;
</text>

<text x="315" y="235" fill="#ff3dbf" font-size="20">
♡

<animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"></animate>

</text>

<text x="220" y="255" fill="white">
█

<animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"></animate>

</text>

<!-- Stickers -->

<text x="95" y="35" fill="#ff5ecf" font-size="18" transform="rotate(-8 95 35)">
rawr!
</text>

<text x="130" y="295" fill="#d18cff" font-size="18" transform="rotate(-6 130 295)">
xoxo
</text>

<text x="560" y="295" fill="#00d9ff" font-size="18" transform="rotate(8 560 295)">
swag
</text>

<text x="760" y="300" fill="#ffffff" opacity=".6" font-size="16">
offline...
</text>

<text x="705" y="260" fill="#ffe347" font-size="20">
&lt;3
</text>

<text x="530" y="280" fill="#ffe347">★</text>
<text x="355" y="290" fill="#ff6fff">✦</text>
<text x="620" y="275" fill="#7cfbff">♪</text>

</svg>
