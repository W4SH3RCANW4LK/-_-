<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">

  <defs>

    <!-- Windows XP-ish purple/pink gradient -->
    <linearGradient id="window" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4fc3"></stop>
      <stop offset="50%" stop-color="#a83cff"></stop>
      <stop offset="100%" stop-color="#6c35d9"></stop>
    </linearGradient>

    <!-- Scene gradient -->
    <linearGradient id="scene" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#ff3dbf"></stop>
      <stop offset="30%" stop-color="#b14dff"></stop>
      <stop offset="60%" stop-color="#7cfbff"></stop>
      <stop offset="80%" stop-color="#ffe347"></stop>
      <stop offset="100%" stop-color="#ff3dbf"></stop>

      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"></animateTransform>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"></feDropShadow>
    </filter>

  </defs>


  <!-- Main card -->

  <rect x="20" y="20" width="860" height="300" rx="18" fill="#17131d" stroke="url(#scene)" stroke-width="4" filter="url(#shadow)"></rect>


  <!-- Window title -->

  <rect x="20" y="20" width="860" height="42" rx="18" fill="url(#window)"></rect>

  <rect x="20" y="45" width="860" height="17" fill="url(#window)"></rect>


  <text x="45" y="48" font-family="monospace" font-size="17" font-weight="bold" fill="white">
    ★ logout.exe
  </text>


  <text x="820" y="48" font-family="monospace" font-size="17" fill="white">
    ─ □ ×
  </text>


  <!-- LEFT EMPTY CHARACTER AREA -->

  <rect x="45" y="82" width="275" height="210" rx="12" fill="#0f0c14" stroke="#ff4fc3" stroke-width="2" stroke-dasharray="7 6" opacity=".85"></rect>


  <!-- little decorations around empty area -->

  <text x="62" y="108" font-size="17" fill="#ffe347">
    ✦
  </text>

  <text x="290" y="275" font-size="18" fill="#7cfbff">
    ♫
  </text>

  <text x="65" y="270" font-size="18" fill="#ff4fc3">
    ♡
  </text>


  <!-- RIGHT TERMINAL -->

  <text x="355" y="100" fill="#d7d7d7" font-family="monospace" font-size="17">
    C:\Users\Guest&gt; exit
  </text>


  <text x="355" y="135" fill="#7cfbff" font-family="monospace" font-size="16">
    [ STATUS ] disconnected...
  </text>


  <text x="355" y="180" fill="white" font-family="monospace" font-size="24">
    connection terminated.
  </text>


  <text x="355" y="218" fill="url(#scene)" font-family="monospace" font-size="21" font-weight="bold">
    see you next login.
  </text>


  <text x="355" y="258" fill="#ff4fc3" font-family="monospace" font-size="18">
    (&gt; ^_^ )&gt; ♡
  </text>


  <text x="355" y="286" fill="#77717d" font-family="monospace" font-size="13">
    system shutting down...
  </text>


  <!-- Decorative stickers -->

  <text x="335" y="85" fill="#ffe347" font-size="18">
    ★
  </text>

  <text x="825" y="105" fill="#ff4fc3" font-size="22">
    ✦
  </text>

  <text x="815" y="270" fill="#7cfbff" font-size="20">
    ♪
  </text>

</svg>
