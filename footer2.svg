<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs>
  <linearGradient id="window" x1="0%" x2="100%" y1="0%" y2="100%">
    <stop offset="0%" stop-color="#ff4fc3"/>
    <stop offset="50%" stop-color="#a83cff"/>
    <stop offset="100%" stop-color="#6c35d9"/>
  </linearGradient>

  <linearGradient id="scene" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#ff3dbf"/>
    <stop offset="30%" stop-color="#b14dff"/>
    <stop offset="60%" stop-color="#7cfbff"/>
    <stop offset="80%" stop-color="#ffe347"/>
    <stop offset="100%" stop-color="#ff3dbf"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>

  <filter id="shadow">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/>
  </filter>
</defs>

<!-- Main window -->
<rect x="20" y="20" width="860" height="300" rx="18"
      fill="#17131d" stroke="url(#scene)" stroke-width="4" filter="url(#shadow)"/>

<!-- Title bar -->
<rect x="20" y="20" width="860" height="42" rx="18" fill="url(#window)"/>
<rect x="20" y="45" width="860" height="17" fill="url(#window)"/>

<text x="45" y="48" font-family="monospace" font-size="17"
      font-weight="bold" fill="white">★ logout.exe</text>

<text x="820" y="48" font-family="monospace" font-size="17"
      fill="white">─ □ ×</text>

<!-- EMPTY CHARACTER AREA: KEEP THIS EMPTY -->
<rect x="45" y="82" width="275" height="210" rx="12"
      fill="#0f0c14" stroke="#ff4fc3" stroke-width="2"
      stroke-dasharray="7 6" opacity=".85"/>

<!-- Small decorations around, NOT inside, character area -->
<text x="30" y="76" font-size="18" fill="#ffe347">✦</text>
<text x="302" y="280" font-size="18" fill="#7cfbff">♫</text>
<text x="52" y="310" font-size="18" fill="#ff4fc3">♡</text>

<!-- Terminal -->
<text x="355" y="100" fill="#d7d7d7" font-family="monospace" font-size="17">
C:\Users\Guest&gt; exit
</text>

<text x="355" y="135" fill="#7cfbff" font-family="monospace" font-size="16">
[ STATUS ] disconnected...
</text>

<text x="355" y="180" fill="white" font-family="monospace" font-size="24">
connection terminated.
</text>

<text x="355" y="218" fill="url(#scene)" font-family="monospace"
      font-size="21" font-weight="bold">
see you next login.
</text>

<text x="355" y="258" fill="#ff4fc3" font-family="monospace" font-size="18">
(&gt; ^_^ )&gt; ♡
</text>

<text x="355" y="286" fill="#77717d" font-family="monospace" font-size="13">
system shutting down...
</text>

<!-- Scene stickers -->
<text x="345" y="78" fill="#ff4fc3" font-family="Comic Sans MS, cursive"
      font-size="18" font-weight="bold" transform="rotate(-8 345 78)">rawr!</text>

<text x="735" y="88" fill="#b14dff" font-family="Comic Sans MS, cursive"
      font-size="19" font-weight="bold" transform="rotate(7 735 88)">xoxo</text>

<text x="720" y="300" fill="#ffe347" font-family="Comic Sans MS, cursive"
      font-size="18" font-weight="bold" transform="rotate(-6 720 300)">swag</text>

<text x="390" y="305" fill="#7cfbff" font-family="Comic Sans MS, cursive"
      font-size="19" font-weight="bold" transform="rotate(5 390 305)">lol</text>

<!-- Extra scene doodles -->
<text x="585" y="80" fill="#ffe347" font-size="15">✦</text>
<text x="850" y="180" fill="#7cfbff" font-size="16">★</text>
<text x="675" y="105" fill="#ff4fc3" font-size="16">♡</text>
<text x="770" y="225" fill="#ff4fc3" font-size="15">♥</text>

<!-- Blinking cursor -->
<text x="355" y="286" fill="#ff4fc3" font-family="monospace" font-size="13">
█
<animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
</text>
</svg>
